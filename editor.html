<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章编辑器 · subdrone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@500;600;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://subdrone.github.io/css/style.css">
<style>
  .ed-top{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;background:color-mix(in srgb,var(--bg-2) 72%,transparent);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
  .ed-top .brand{margin-right:auto}
  .ed-top h1{font-size:16px;font-family:var(--font-display);color:var(--text-dim)}
  .ed-wrap{max-width:1240px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:start}
  @media(max-width:980px){.ed-wrap{grid-template-columns:1fr}}
  .ed-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;backdrop-filter:blur(10px)}
  .ed-card h2{font-family:var(--font-display);font-size:15px;color:var(--accent);margin-bottom:14px}
  .ed-field{margin-bottom:14px}
  .ed-field>label{display:block;font-size:12px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.06em}
  .ed-field input[type=text],.ed-field input[type=date],.ed-field input[type=number],.ed-field input[type=password],.ed-field textarea{
    width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;color:var(--text);
    padding:10px 12px;font-size:14px;outline:none;transition:border-color .2s;
  }
  .ed-field input:focus,.ed-field textarea:focus{border-color:var(--accent)}
  .ed-field textarea{min-height:240px;resize:vertical;line-height:1.7}
  .ed-row{display:flex;gap:12px}
  .ed-row>*{flex:1;min-width:0}
  .ed-mini{font-size:11px;color:var(--text-faint);margin-top:4px}
  .ed-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .ed-swatch{width:28px;height:28px;border-radius:9px;border:2px solid transparent;cursor:pointer}
  .ed-swatch.is-on{border-color:var(--text)}
  input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer}
  .ed-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .ed-status{margin-top:12px;font-size:12.5px;color:var(--text-dim);min-height:1.4em;line-height:1.5}
  .ed-status.ok{color:var(--accent)} .ed-status.err{color:var(--danger)}
  .ed-list{display:flex;flex-direction:column;gap:6px}
  .ed-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-size:13px}
  .ed-item:hover{border-color:var(--accent)}
  .ed-item .no{font-family:var(--font-mono);color:var(--accent);min-width:30px}
  .ed-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ed-item .del{color:var(--danger);padding:2px 8px;border-radius:8px}
  details.ed-set summary{cursor:pointer;font-size:12.5px;color:var(--text-dim);margin-bottom:10px}
  .ed-preview{position:sticky;top:86px}
  .ed-cover{height:150px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);margin-bottom:16px}
  .ed-cover .big-glyph{font-size:60px;font-weight:700;filter:drop-shadow(0 0 20px currentColor)}
  .ed-pv .reader-body{font-size:15px}
  .ed-pv .reader-body h1,.ed-pv .reader-body h2,.ed-pv .reader-body h3{margin-top:1.6em}
</style>
</head>
<body>
<header class="ed-top">
  <a class="brand" href="/"><span class="brand-text">subdrone</span></a>
  <h1>文章编辑器</h1>
  <a class="btn btn-ghost btn-sm" href="/">← 回到博客</a>
</header>

<main class="ed-wrap">
  <section>
    <div class="ed-card">
      <h2>写文章</h2>
      <div class="ed-field"><label>标题</label><input id="title" type="text" placeholder="文章标题"></div>
      <div class="ed-row">
        <div class="ed-field"><label>编号（自动递增）</label><input id="no" type="number"></div>
        <div class="ed-field"><label>id（自动，URL 用）</label><input id="id" type="text"></div>
      </div>
      <div class="ed-row">
        <div class="ed-field"><label>日期</label><input id="date" type="date"></div>
        <div class="ed-field"><label>阅读分钟（自动）</label><input id="time" type="number"></div>
        <div class="ed-field"><label>字数（自动）</label><input id="words" type="number" readonly></div>
      </div>
      <div class="ed-field"><label>标签（逗号分隔）</label><input id="tags" type="text" placeholder="随笔, 代码"></div>
      <div class="ed-field">
        <label>封面配色</label>
        <div class="ed-row"><input id="c1" type="color" value="#ff8ebd"><input id="c2" type="color" value="#b0a0f0"></div>
        <div class="ed-swatches" id="swatches"></div>
      </div>
      <div class="ed-field"><label>摘要（留空自动取正文首行）</label><input id="excerpt" type="text"></div>
      <div class="ed-field"><label>正文（Markdown）</label><textarea id="body" placeholder="在这里写正文，支持 Markdown…"></textarea></div>
      <div class="ed-actions">
        <button class="btn btn-primary" id="btnPublish">发布到仓库</button>
        <button class="btn btn-ghost" id="btnNew">新建</button>
        <button class="btn btn-ghost" id="btnExport">导出文件</button>
        <button class="btn btn-ghost" id="btnCopy">复制内容</button>
      </div>
      <div class="ed-status" id="status"></div>
      <details class="ed-set" style="margin-top:16px">
        <summary>仓库设置 / Token</summary>
        <div class="ed-row">
          <div class="ed-field"><label>仓库</label><input id="repo" type="text" value="subdrone/subdrone.github.io"></div>
          <div class="ed-field"><label>分支</label><input id="branch" type="text" value="main"></div>
        </div>
        <div class="ed-field"><label>GitHub Token（只存你本机浏览器；权限仅需 Contents: Read and write）</label><input id="token" type="password" placeholder="github_pat_... 或 ghp_..."></div>
        <div class="ed-actions"><button class="btn btn-ghost btn-sm" id="btnPull">从仓库拉取文章列表</button></div>
      </details>
    </div>

    <div class="ed-card" style="margin-top:20px">
      <h2>已有文章</h2>
      <div class="ed-list" id="list"><div class="ed-mini">加载中…</div></div>
    </div>
  </section>

  <section class="ed-preview">
    <div class="ed-card ed-pv">
      <h2>预览</h2>
      <div class="ed-cover" id="pvCover"></div>
      <h1 style="font-family:var(--font-display);font-size:26px;margin-bottom:10px" id="pvTitle"></h1>
      <div class="reader-tags mono" id="pvTags" style="display:flex;gap:8px;margin-bottom:8px"></div>
      <div class="mono" style="font-size:12px;color:var(--text-faint);margin-bottom:16px" id="pvMeta"></div>
      <div class="reader-body" id="pvBody"></div>
    </div>
  </section>
</main>

<script src="https://subdrone.github.io/js/lib/marked.min.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const PATH = 'js/articles-data.js';
const PRESETS = [["#ff8ebd","#b0a0f0"],["#ffc98b","#ff8ebd"],["#8fdcc9","#b0a0f0"],["#b0a0f0","#8fdcc9"],["#ff9ec4","#ffcf94"],["#7dd3fc","#b0a0f0"]];
let list = [];
let fileSha = null;
let editIdx = -1;
let excerptTouched = false;

const b64d = (b64) => { const bin = atob(b64.replace(/\s/g, '')); const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0)); return new TextDecoder().decode(bytes); };
const b64e = (str) => { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); }); return btoa(bin); };
const nextNo = () => list.reduce((m, a) => Math.max(m, Number(a.no) || 0), 0) + 1;
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const wc = (s) => (s || '').replace(/\s/g, '').length;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function autoExcerpt(body) {
  const line = (body || '').split('\n').map((l) => l.trim()).find((l) => l && !l.startsWith('#') && !l.startsWith('```')) || '';
  return line.replace(/[*_`>#\-\[\]()!]/g, '').slice(0, 80);
}
function setStatus(msg, cls) { const el = $('#status'); el.textContent = msg || ''; el.className = 'ed-status' + (cls ? (' ' + cls) : ''); }

function fillForm(a, isEdit) {
  $('#no').value = a.no != null ? a.no : nextNo();
  $('#id').value = a.id || ('post-' + $('#no').value);
  $('#title').value = a.title || '';
  $('#date').value = a.date || todayISO();
  $('#time').value = a.time || 1;
  $('#words').value = a.words || 0;
  $('#tags').value = (a.tags || []).join(', ');
  $('#c1').value = (a.cover && a.cover[0]) || '#ff8ebd';
  $('#c2').value = (a.cover && a.cover[1]) || '#b0a0f0';
  $('#excerpt').value = a.excerpt || '';
  $('#body').value = a.body || '';
  excerptTouched = !!isEdit;
  $('#id').dataset.touched = isEdit ? '1' : '';
  $('#time').dataset.touched = isEdit ? '1' : '';
  syncColorUI(); updatePreview();
}
function newPost() { editIdx = -1; fillForm({ no: nextNo(), id: 'post-' + nextNo(), date: todayISO(), time: 1, words: 0, cover: PRESETS[0] }, false); setStatus('新建中（编号 #' + nextNo() + '）'); }

function formArticle() {
  const body = $('#body').value;
  const words = wc(body);
  return {
    id: $('#id').value.trim() || ('post-' + ($('#no').value || nextNo())),
    no: Number($('#no').value) || nextNo(),
    title: $('#title').value.trim(),
    date: $('#date').value || todayISO(),
    time: Number($('#time').value) || Math.max(1, Math.ceil(words / 300)),
    words,
    tags: $('#tags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
    cover: [$('#c1').value, $('#c2').value],
    excerpt: $('#excerpt').value.trim() || autoExcerpt(body),
    body,
  };
}

function updatePreview() {
  const a = formArticle();
  $('#pvCover').innerHTML = '<span class="big-glyph" style="color:' + a.cover[0] + '">#' + a.no + '</span>';
  $('#pvCover').style.background = 'linear-gradient(135deg,' + a.cover[0] + '44,' + a.cover[1] + '22),var(--bg-2)';
  $('#pvTitle').textContent = a.title || '（无标题）';
  $('#pvTags').innerHTML = a.tags.map((t) => '<span class="mini-tag">#' + esc(t) + '</span>').join('');
  $('#pvMeta').textContent = a.date + ' · ' + a.time + ' min · ' + a.words + ' 字';
  const md = a.body || '';
  $('#pvBody').innerHTML = window.marked ? marked.parse(md) : '<p>' + esc(md).replace(/\n/g, '<br>') + '</p>';
}

function autoFields() {
  const body = $('#body').value;
  $('#words').value = wc(body);
  if (!$('#time').dataset.touched) $('#time').value = Math.max(1, Math.ceil(wc(body) / 300));
  if (!excerptTouched) $('#excerpt').value = autoExcerpt(body);
  if (!$('#id').dataset.touched) $('#id').value = 'post-' + (Number($('#no').value) || nextNo());
}

function renderList() {
  const box = $('#list');
  if (!list.length) { box.innerHTML = '<div class="ed-mini">还没有文章</div>'; return; }
  box.innerHTML = list.map((a, i) => ({ a, i })).sort((x, y) => (y.a.no || 0) - (x.a.no || 0)).map(({ a, i }) =>
    '<div class="ed-item" data-i="' + i + '"><span class="no">#' + (a.no != null ? a.no : '?') + '</span><span class="t">' + esc(a.title || '(无标题)') + '</span><button class="del" data-del="' + i + '">删除</button></div>'
  ).join('');
  box.querySelectorAll('.ed-item').forEach((el) => el.addEventListener('click', (e) => {
    if (e.target.dataset.del !== undefined) return;
    editIdx = Number(el.dataset.i); fillForm(list[editIdx], true); setStatus('编辑 #' + list[editIdx].no);
  }));
  box.querySelectorAll('[data-del]').forEach((btn) => btn.addEventListener('click', (e) => {
    e.stopPropagation(); const i = Number(btn.dataset.del);
    if (confirm('删除《' + (list[i].title || '') + '》？')) { list.splice(i, 1); renderList(); }
  }));
}

function syncColorUI() { $$('.ed-swatch').forEach((s) => s.classList.toggle('is-on', s.dataset.c1 === $('#c1').value && s.dataset.c2 === $('#c2').value)); }
function buildSwatches() {
  $('#swatches').innerHTML = PRESETS.map((p) => '<span class="ed-swatch" data-c1="' + p[0] + '" data-c2="' + p[1] + '" style="background:linear-gradient(135deg,' + p[0] + ',' + p[1] + ')"></span>').join('');
  $$('.ed-swatch').forEach((s) => s.addEventListener('click', () => { $('#c1').value = s.dataset.c1; $('#c2').value = s.dataset.c2; syncColorUI(); updatePreview(); }));
}

function serialize() {
  const header = '/* articles-data.js — 由编辑器生成。字段：no, id, title, date, time, words, tags, cover, excerpt, body */\n';
  return header + 'window.BLOG_ARTICLES = ' + JSON.stringify(list, null, 2) + ';\n';
}
function parseArticles(text) {
  const fn = new Function(text + '\nreturn (typeof window !== "undefined") ? window.BLOG_ARTICLES : [];');
  const arr = fn(); return Array.isArray(arr) ? arr : [];
}

function apiHeaders() {
  const tok = $('#token').value.trim();
  const h = { Accept: 'application/vnd.github+json' };
  if (tok) h.Authorization = 'Bearer ' + tok;
  return h;
}
async function pull() {
  const repo = $('#repo').value.trim() || 'subdrone/subdrone.github.io';
  const branch = $('#branch').value.trim() || 'main';
  setStatus('正在拉取…');
  try {
    const r = await fetch('https://api.github.com/repos/' + repo + '/contents/' + PATH + '?ref=' + encodeURIComponent(branch) + '&t=' + Date.now(), { headers: apiHeaders(), cache: 'no-store' });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 120));
    const data = await r.json();
    fileSha = data.sha;
    list = parseArticles(b64d(data.content));
    renderList(); newPost();
    setStatus('已拉取 ' + list.length + ' 篇文章 ✅', 'ok');
  } catch (err) { setStatus('拉取失败：' + err.message + '（可先用「导出文件」手动提交）', 'err'); }
}
async function publish() {
  const repo = $('#repo').value.trim() || 'subdrone/subdrone.github.io';
  const branch = $('#branch').value.trim() || 'main';
  const tok = $('#token').value.trim();
  if (!tok) { setStatus('请先在「仓库设置 / Token」里填入 GitHub Token', 'err'); document.querySelector('details.ed-set').open = true; return; }
  const a = formArticle();
  if (!a.title) { setStatus('标题不能为空', 'err'); return; }
  if (editIdx >= 0) list[editIdx] = a; else list.push(a);
  setStatus('正在发布…');
  try {
    const r = await fetch('https://api.github.com/repos/' + repo + '/contents/' + PATH, {
      method: 'PUT',
      headers: Object.assign({ 'Content-Type': 'application/json' }, apiHeaders()),
      body: JSON.stringify({ message: 'post: ' + a.title, content: b64e(serialize()), sha: fileSha, branch }),
    });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 160));
    const data = await r.json(); fileSha = data.content.sha;
    renderList(); const saved = a; newPost();
    setStatus('已发布《' + saved.title + '》✅ GitHub Pages 约 1–2 分钟后更新', 'ok');
  } catch (err) { setStatus('发布失败：' + err.message, 'err'); }
}
function exportFile() {
  const blob = new Blob([serialize()], { type: 'text/javascript;charset=utf-8' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = 'articles-data.js'; a.click(); URL.revokeObjectURL(url);
}
async function copyContent() {
  try { await navigator.clipboard.writeText(serialize()); setStatus('已复制到剪贴板 ✅', 'ok'); }
  catch { setStatus('复制失败，请用「导出文件」', 'err'); }
}

$('#title').addEventListener('input', () => updatePreview());
$('#body').addEventListener('input', () => { autoFields(); updatePreview(); });
$('#excerpt').addEventListener('input', () => { excerptTouched = true; updatePreview(); });
$('#id').addEventListener('input', () => { $('#id').dataset.touched = '1'; });
$('#time').addEventListener('input', () => { $('#time').dataset.touched = '1'; });
['#tags', '#date', '#no'].forEach((s) => $(s).addEventListener('input', updatePreview));
['#c1', '#c2'].forEach((s) => $(s).addEventListener('input', () => { syncColorUI(); updatePreview(); }));
$('#btnNew').addEventListener('click', newPost);
$('#btnPublish').addEventListener('click', publish);
$('#btnPull').addEventListener('click', pull);
$('#btnExport').addEventListener('click', exportFile);
$('#btnCopy').addEventListener('click', copyContent);
$('#token').value = localStorage.getItem('ed.token') || '';
$('#token').addEventListener('input', () => localStorage.setItem('ed.token', $('#token').value));

buildSwatches();
newPost();
pull();
</script>
</body>
</html>
