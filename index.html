<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的博客</title>
<meta name="description" content="一个用于存放文章的个人博客。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0f14'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='%235eead4' font-family='monospace' font-weight='700'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@500;600;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>

<!-- ===== 全局背景：风场粒子画布 ===== -->
<canvas id="field" aria-hidden="true"></canvas>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-vignette" aria-hidden="true"></div>
<div class="bg-noise" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>

<!-- 自定义光标 -->
<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>

<!-- 阅读进度条 -->
<div id="progress" aria-hidden="true"></div>

<!-- ===== 左侧栏：品牌 + 导航 ===== -->
<aside class="sidebar">
  <a class="brand" href="#" data-nav="home">
    <span class="brand-text" data-text="brand">BLOG<span class="brand-dot">.</span>ME</span>
  </a>
  <nav class="nav-links sidebar-nav" aria-label="主导航">
    <a href="#" data-nav="home" class="nav-link is-active"><span data-text="navHome">首页</span></a>
    <a href="#articles" data-nav="articles" class="nav-link"><span data-text="navArticles">文章</span></a>
    <a href="#timeline" data-nav="timeline" class="nav-link"><span data-text="navTimeline">时间线</span></a>
    <div class="nav-group is-open">
      <button class="nav-group-head" type="button" data-group="toys" aria-expanded="true">
        <span data-text="navToys">小玩意</span>
        <span class="nav-caret" aria-hidden="true">▾</span>
      </button>
      <div class="nav-sub">
        <a href="#/toys" data-nav="toys" class="nav-link nav-sub-link"><span data-text="navGoethe">歌德词汇</span></a>
      </div>
    </div>
  </nav>
  <div class="sidebar-social">
    <a href="https://github.com/subdrone" target="_blank" rel="noopener nofollow" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11 11 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.5 12C23.5 5.7 18.3.5 12 .5z"/></svg>
    </a>
    <a href="https://x.com/noonecomes_qwq" target="_blank" rel="noopener nofollow" aria-label="X" title="X">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M18.9 2H22l-7.1 8.1L23.2 22h-6.6l-5.2-6.8L5.4 22H2.3l7.6-8.7L1.1 2h6.8l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.8H5.4L17.8 20z"/></svg>
    </a>
    <a href="https://t.me/no_one_comes_tg" target="_blank" rel="noopener nofollow" aria-label="Telegram" title="Telegram">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9.8 15.6l-.3 4.4c.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.6.2 1.8-.8l3.3-15.4c.3-1.3-.5-1.8-1.3-1.5L2.4 9.9c-1.3.5-1.3 1.2-.2 1.6l4.6 1.4L17.5 6c.5-.3.9-.1.6.2l-9 8.1z"/></svg>
    </a>
    <a class="social-qq" href="#" data-qq="MjY1NDg3MTkzMw==" rel="nofollow" aria-label="QQ" title="QQ（点击聊天）">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21.395 15.035a40 40 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a39 39 0 0 0-.802 2.264c-1.021 3.283-.69 4.643-.438 4.673c.54.065 2.103-2.472 2.103-2.472c0 1.469.756 3.387 2.394 4.771c-.612.188-1.363.479-1.845.835c-.434.32-.379.646-.301.778c.343.578 5.883.369 7.482.189c1.6.18 7.14.389 7.483-.189c.078-.132.132-.458-.301-.778c-.483-.356-1.233-.646-1.846-.836c1.637-1.384 2.393-3.302 2.393-4.771c0 0 1.563 2.537 2.103 2.472c.251-.03.581-1.39-.438-4.673"/></svg>
    </a>
    <a class="social-mail" href="#" data-mail="bW9jLmtvb2x0dW9AcF9zZW1vQ2VuT29O" rel="nofollow" aria-label="邮箱" title="邮箱（点击发信）">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v.2l-10 6.1L2 6.2V6zM2 8.4l9.5 5.8a1 1 0 0 0 1 0L22 8.4V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.4z"/></svg>
    </a>
  </div>
</aside>

<!-- ===== 顶栏：搜索 + 主题 ===== -->
<header class="nav" id="nav">
  <div class="nav-inner">
    <div class="search-box topsearch">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="topSearch" type="text" data-ph="searchPlaceholder" placeholder="搜索文章标题 / 全文…" autocomplete="off">
      <button class="search-clear" id="topSearchClear" data-aria="a11yClear" aria-label="清除搜索" hidden>×</button>
    </div>
    <button class="icon-btn" id="btnTheme" data-aria="a11yTheme" aria-label="切换主题">
      <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="shell">

  <!-- ===== 主页（hero + 文章区） ===== -->
  <section class="view view-home is-active" data-view="home">

    <!-- HERO -->
    <div class="hero" id="hero">
      <div class="hero-inner">
        <div class="hero-badge mono" id="heroBadge">
          <span class="pulse-dot"></span>
          <span id="sysText" data-text="heroBadge">FLOWFIELD ONLINE</span>
        </div>
        <h1 class="hero-title">
          <span class="line" id="typeStatic" data-text="heroHi"></span>
          <span class="line hero-name"><span class="grad" data-text="heroName">无人机潜水</span></span>
        </h1>
        <p class="hero-sub mono" id="typeWords">记录代码与生活</p>
        <div class="hero-stats mono" id="heroStats">
          <div class="stat"><span class="stat-num" id="statPosts">--</span><span class="stat-lab" data-text="statPosts">POSTS</span></div>
          <div class="stat"><span class="stat-num" id="statWords">--</span><span class="stat-lab" data-text="statWords">WORDS</span></div>
          <div class="stat"><span class="stat-num" id="statTags">--</span><span class="stat-lab" data-text="statTags">TAGS</span></div>
        </div>
      </div>
      <a class="hero-scrollhint mono" id="scrollHint" href="#articles" data-goto="articles" aria-label="进入文章">
        <span data-text="scrollHint">SCROLL</span>
        <span class="line-v"></span>
      </a>
    </div>

    <!-- 文章板块 -->
    <div class="articles" id="articles">
      <div class="section-head reveal">
        <h2 class="section-title"><span data-text="sectionArticles">文章</span><span class="section-title-accent" data-text="sectionArticlesEn">LIBRARY</span></h2>
      </div>

      <div class="toolbar reveal">
        <div class="tagbar" id="tagbar"></div>
        <div class="sortbar mono">
          <span class="result-count" id="resultCount"></span>
        </div>
      </div>

      <div class="cardgrid" id="cardGrid"></div>
      <div class="empty" id="emptyState" hidden>
        <span class="empty-glyph" data-text="emptyGlyph">∅</span>
        <p data-text="emptyNoMatch">没有匹配的文章，换个关键词试试？</p>
      </div>
    </div>
  </section>

  <!-- ===== 时间线视图 ===== -->
  <section class="view" data-view="timeline">
    <div class="page-head reveal">
      <span class="section-kicker mono" data-text="kickerArchive">// ARCHIVE</span>
      <h2 class="section-title"><span data-text="sectionTimeline">时间线</span><span class="section-title-accent" data-text="sectionTimelineEn">TIMELINE</span></h2>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- ===== 小玩意视图 ===== -->
  <section class="view view-toys" data-view="toys">
    <iframe id="toysFrame" class="toys-frame" title="小玩意" loading="lazy"></iframe>
  </section>

  <!-- ===== 阅读视图 ===== -->
  <section class="view view-reader" data-view="reader" hidden>
    <article class="reader" id="reader">
      <div class="reader-actions">
        <button class="btn btn-ghost btn-sm" id="btnBack" data-goto="back">
          <span class="btn-arr">←</span> <span data-text="back">返回</span>
        </button>
        <div class="reader-actions-right">
          <button class="icon-btn" id="btnRss" data-aria="a11yRss" aria-label="RSS 订阅">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4 11a9 9 0 0 1 9 9h-2a7 7 0 0 0-7-7zM4 4a16 16 0 0 1 16 16h-2A14 14 0 0 0 4 18z"/><circle cx="5" cy="19" r="1.5"/></svg>
          </button>
        </div>
      </div>
      <div class="reader-cover" id="readerCover"></div>
      <header class="reader-head">
        <div class="reader-tags mono" id="readerTags"></div>
        <h1 class="reader-title" id="readerTitle"></h1>
        <p class="reader-excerpt" id="readerExcerpt"></p>
        <div class="reader-meta mono">
          <span id="readerDate"></span>
          <span class="meta-sep">·</span>
          <span id="readerTime"></span>
          <span class="meta-sep">·</span>
          <span><span id="readerViews">0</span> 次阅读</span>
        </div>
      </header>
      <div class="reader-body" id="readerBody"></div>
      <div class="reader-nav" id="readerNav"></div>
      <section class="comments" id="comments">
        <h3 class="comments-title mono" data-text="commentsTitle">// COMMENTS · GISCUS</h3>
        <div class="giscus" id="giscus"></div>
      </section>
      <div class="reader-end mono" data-text="readerEnd">— 全文完 —</div>
    </article>
  </section>

  <!-- ===== 404 视图 ===== -->
  <section class="view" data-view="notfound">
    <div class="nf">
      <canvas id="nfCanvas" width="640" height="240"></canvas>
      <p class="nf-msg mono" data-text="nfMsg">页面不存在了，换个地址试试。</p>
      <a href="#" class="btn btn-primary" data-goto="home"><span class="btn-label" data-text="nfHome">回到首页</span></a>
    </div>
  </section>
</main>

<!-- 底部状态栏 -->
<footer class="statusbar mono">
  <span id="clock">--:--:--</span>
  <span class="status-sep">|</span>
  <span id="particleCount">0 PARTICLES</span>
  <span class="status-sep">|</span>
  <span data-text="statusField">粒子风场 · 风眼: </span><span id="eyeState" data-text="eyeIdle">待机</span>
  <span class="status-sep hide-sm">|</span>
  <span class="hide-sm status-credit" data-text="statusCredit">评论 @Giscus · 统计 @GoatCounter</span>
  <span class="status-right hide-sm">
    <a href="#" id="footerRss" data-text="statusRss">RSS ↗</a>
    <span class="status-sep">|</span>
    <a href="#articles" data-goto="articles" data-text="statusArticles">文章</a>
  </span>
</footer>

<script src="js/text.js?v=21"></script>
<script src="js/articles-data.js?v=21"></script>
<script src="js/lib/marked.min.js?v=21"></script>
<script src="js/lib/highlight.min.js?v=21"></script>
<script src="js/main.js?v=21"></script>
</body>
</html>
